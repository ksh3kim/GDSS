<!DOCTYPE html>

<head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Favicon -->
    <link rel="icon" type="image/png" href="favicon.png">
    <link rel="apple-touch-icon" href="favicon.png">

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link rel="stylesheet" href="css/styles-themes.css">
    <link rel="stylesheet" href="css/styles-components.css">

    <!-- Apply saved theme before paint to avoid flash (FOUC) -->
    <script>
        (function () {
            try {
                var valid = ['dark', 'light', 'trueblack', 'rx78', 'char', 'zeon', 'unicorn', 'eva', 'custom'];
                var t = localStorage.getItem('gunpla-theme');
                if (valid.indexOf(t) === -1) t = 'dark';
                if (t !== 'dark') document.documentElement.setAttribute('data-theme', t);
                if (t === 'custom') {
                    var c = JSON.parse(localStorage.getItem('gunpla-theme-custom') || 'null');
                    if (c) {
                        var shade = function (hex, p) {
                            var h = String(hex || '').replace('#', '');
                            if (h.length === 3) h = h[0] + h[0] + h[1] + h[1] + h[2] + h[2];
                            var n = parseInt(h, 16); if (isNaN(n)) return hex;
                            var r = (n >> 16) & 255, g = (n >> 8) & 255, b = n & 255;
                            var tt = p < 0 ? 0 : 255, a = Math.abs(p);
                            r = Math.round((tt - r) * a) + r; g = Math.round((tt - g) * a) + g; b = Math.round((tt - b) * a) + b;
                            return '#' + ((1 << 24) + (r << 16) + (g << 8) + b).toString(16).slice(1);
                        };
                        var s = document.documentElement.style;
                        var m = {
                            '--color-primary': c.primary, '--color-primary-dark': shade(c.primary, -0.2), '--color-primary-light': shade(c.primary, 0.2),
                            '--color-accent': c.accent, '--color-accent-dark': shade(c.accent, -0.2),
                            '--theme-bg': c.bg, '--color-dark-bg': c.bg,
                            '--theme-surface': c.surface, '--color-dark-surface': c.surface, '--theme-card-bg': c.surface,
                            '--theme-border': shade(c.surface, 0.12), '--color-dark-border': shade(c.surface, 0.12),
                            '--theme-text': c.text, '--color-dark-text': c.text
                        };
                        for (var k in m) { if (m[k]) s.setProperty(k, m[k]); }
                    }
                }
            } catch (e) { }
        })();
    </script>
</head>

<body class="detail-page">

                        <button class="theme-option" data-theme="dark">🌙 다크</button>

                        <button class="theme-option" data-theme="trueblack">⚫ 트루 블랙</button>

                        <div class="theme-customizer" id="themeCustomizer">

                            <label class="tc-row"><span>강조</span><input type="color" data-custom="accent"></label>
                            <label class="tc-row"><span>배경</span><input type="color" data-custom="bg"></label>
                            <label class="tc-row"><span>카드</span><input type="color" data-custom="surface"></label>
                            <label class="tc-row"><span>텍스트</span><input type="color" data-custom="text"></label>

                <button class="lang-toggle" id="langToggle" aria-label="Toggle Language">
                    <span class="lang-ko">KO</span>

                    <span class="lang-en">EN</span>
                </button>
            </nav>

            <button class="mobile-menu-btn" id="mobileMenuBtn" aria-label="Menu">

                <span></span>
                <span></span>

                <a href="#" class="mobile-nav-item" data-page="favorites" data-i18n="nav.favorites">즐겨찾기</a>

                    <button class="mobile-theme-btn" data-theme="zeon" title="지온">🟢</button>
                    <button class="mobile-theme-btn" data-theme="unicorn" title="유니콘">🦄</button>

                    <button class="mobile-theme-btn" data-theme="custom" title="커스텀">🎨</button>
                </div>
                <div class="theme-customizer" id="mobileThemeCustomizer">

                    <label class="tc-row"><span>강조</span><input type="color" data-custom="accent"></label>
                    <label class="tc-row"><span>배경</span><input type="color" data-custom="bg"></label>
                    <label class="tc-row"><span>카드</span><input type="color" data-custom="surface"></label>

            <button class="mobile-lang-toggle" id="mobileLangToggle">

    <!-- Main Content -->
    <main class="detail-content">
        <!-- Breadcrumb -->
        <nav class="breadcrumb" id="breadcrumb">
            <a href="index.html" data-i18n="nav.home">홈</a>
            <span class="breadcrumb-separator">›</span>
            <span class="breadcrumb-grade" id="breadcrumbGrade">HG</span>
            <span class="breadcrumb-separator">›</span>
            <span class="breadcrumb-current" id="breadcrumbCurrent">제품명</span>
        </nav>

        <!-- Recently Viewed Products (thumbnails only, no text) -->
        <div class="recent-products-section" id="recentProductsSection" style="display: none;">
            <span class="recent-products-icon" title="최근 본 제품">🕒</span>
            <div class="recent-products-list" id="recentProductsList">

            <button class="recent-products-clear" id="clearRecentBtn" title="기록 삭제">×</button>
        </div>

        <!-- Product Detail Container -->
        <div class="detail-container">
            <!-- Product Gallery -->
            <section class="detail-gallery">

                    <img src="" alt="" id="mainImage">
                    <button class="gallery-nav prev" id="galleryPrev" aria-label="Previous">
                        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                            stroke-width="2">
                            <polyline points="15 18 9 12 15 6"></polyline>
                        </svg>
                    </button>
                    <button class="gallery-nav next" id="galleryNext" aria-label="Next">
                        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                            stroke-width="2">
                            <polyline points="9 18 15 12 9 6"></polyline>
                        </svg>
                    </button>
                </div>
                <div class="gallery-thumbnails" id="galleryThumbnails">

                </div>
            </section>

            <!-- Product Info -->
            <section class="detail-info">

                    </div>

                    <p class="detail-series" id="detailSeries">시리즈</p>

                </div>

                <!-- Quick Actions -->
                <div class="detail-actions">
                    <button class="action-btn-large favorite-btn" id="detailFavoriteBtn">

                            </path>

                            <line x1="6" y1="20" x2="6" y2="14"></line>
                        </svg>

                    </button>
                    <a class="action-btn-large manual-btn" id="detailManualBtn" href="javascript:void(0)"
                        target="_blank" rel="noopener noreferrer">
                        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor"

                            <path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"></path>
                            <path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"></path>
                        </svg>
                        <span>반다이 매뉴얼</span>
                    </a>
                </div>

                <!-- Price & Release -->
                <div class="detail-meta">

                        <span class="meta-label" data-i18n="product.price">가격</span>

                            <ul class="recommended-for-list" id="recommendedForList">

                        <div class="variants-section">

                        <div class="related-grades-section">

                            <div class="related-grades" id="relatedGrades">
                                <!-- Related grades will be dynamically inserted -->

        </a>
    </template>

    <!-- Scripts -->
    <script src="js/i18n.js"></script>
    <script src="js/filter.js"></script>
    <script src="js/recommendation.js"></script>
    <script src="js/app.js"></script>
    <script>
        // Initialize detail page
        document.addEventListener('DOMContentLoaded', function () {
            const urlParams = new URLSearchParams(window.location.search);
            const productId = urlParams.get('id');
            if (productId && window.GunplaApp) {
                window.GunplaApp.loadProductDetail(productId);
            }
        });
    </script>
