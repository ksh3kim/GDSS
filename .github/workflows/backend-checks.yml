# Build-time backend checks: data validation + serverless API tests.
# Runs on GitHub only when this file is pushed; needs no secrets.
name: Backend checks

on:
  push:
    paths:
      - 'data/**'
      - 'scripts/**'
      - 'serverless/**'
      - 'js/**'
      - '*.html'
      - '.github/workflows/backend-checks.yml'
  pull_request:
    paths:
      - 'data/**'
      - 'scripts/**'
      - 'serverless/**'
      - 'js/**'
      - '*.html'
      - '.github/workflows/backend-checks.yml'

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate data files
        run: node scripts/validate-data.mjs
      - name: Serverless API tests (offline)
        working-directory: serverless
        run: node --test "test/*.test.js"
